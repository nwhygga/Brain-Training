<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нейро-Атлет | Хардкор Сессия</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .tap-highlight { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 tap-highlight">

    <!-- Меню выбора уровня сложности -->
    <div id="main-menu" class="w-full max-w-md bg-gray-900/90 backdrop-blur-xl border border-gray-800 rounded-3xl p-5 shadow-2xl flex flex-col gap-5 my-auto">
        <div class="flex items-center justify-between bg-gray-800/60 p-3.5 rounded-2xl border border-gray-700/50">
            <div>
                <h2 class="font-bold text-base text-white">Нейро-Атлет</h2>
                <span class="text-xs text-indigo-400 font-medium">Хардкор с таймером v4.0</span>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-400">Опыт XP</div>
                <div id="stat-xp" class="text-sm font-bold text-indigo-300">0</div>
            </div>
        </div>

        <div class="flex flex-col gap-3">
            <h3 class="font-bold text-white text-sm">Выбери уровень сложности:</h3>
            <button onclick="startComplexSession(1)" class="p-3.5 bg-blue-600/20 border border-blue-500 rounded-2xl text-left transition-all active:scale-95 tap-highlight">
                <div class="font-bold text-blue-400 text-sm">🟢 Уровень 1: Базовый</div>
                <div class="text-[11px] text-gray-300">Много времени на раунд, мягкий темп.</div>
            </button>
            <button onclick="startComplexSession(2)" class="p-3.5 bg-amber-600/20 border border-amber-500 rounded-2xl text-left transition-all active:scale-95 tap-highlight">
                <div class="font-bold text-amber-400 text-sm">🟡 Уровень 2: Эксперт</div>
                <div class="text-[11px] text-gray-300">Умеренный таймер, усложненные задачи.</div>
            </button>
            <button onclick="startComplexSession(3)" class="p-3.5 bg-red-600/20 border border-red-500 rounded-2xl text-left transition-all active:scale-95 tap-highlight">
                <div class="font-bold text-red-400 text-sm">🔴 Уровень 3: Хардкор</div>
                <div class="text-[11px] text-gray-300">Жесткий таймер (4 сек), 0 права на ошибку.</div>
            </button>
        </div>
    </div>

    <!-- Модальное окно сессии -->
    <div id="game-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-3xl p-6 flex flex-col items-center text-center relative shadow-2xl">
            <button onclick="abortSession()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-lg font-bold p-2 tap-highlight">✕</button>
            <!-- Таймер-полоска -->
            <div class="w-full bg-gray-800 h-1.5 rounded-full mb-4 overflow-hidden">
                <div id="timer-bar" class="bg-indigo-500 h-full w-full transition-all duration-100"></div>
            </div>
            <div id="game-container" class="w-full flex flex-col items-center"></div>
        </div>
    </div>

    <script>
        let userData = { xp: 0 };
        let currentDifficulty = 1; // 1, 2, 3
        let sessionResults = { struop: 0, memory: 0, reaction: 0, math: 0 };
        let currentStage = 1;
        
        let roundTimer = null;
        let timeLeft = 10;
        let totalTimeForRound = 10;

        function loadData() {
            let saved = localStorage.getItem('neuro_flex_v4');
            if (saved) { try { userData = JSON.parse(saved); } catch(e) {} }
            document.getElementById('stat-xp').innerText = userData.xp;
        }

        function saveData() {
            localStorage.setItem('neuro_flex_v4', JSON.stringify(userData));
            document.getElementById('stat-xp').innerText = userData.xp;
        }

        function abortSession() {
            clearInterval(roundTimer);
            document.getElementById('game-modal').classList.add('hidden');
        }

        function startComplexSession(diff) {
            currentDifficulty = diff;
            sessionResults = { struop: 0, memory: 0, reaction: 0, math: 0 };
            currentStage = 1;
            document.getElementById('game-modal').classList.remove('hidden');
            
            // Время на раунд зависит от сложности
            totalTimeForRound = diff === 1 ? 12 : (diff === 2 ? 8 : 4);
            startStruopStage();
        }

        function startTimer(onTimeoutCallback) {
            clearInterval(roundTimer);
            timeLeft = totalTimeForRound;
            let bar = document.getElementById('timer-bar');
            
            roundTimer = setInterval(() => {
                timeLeft -= 0.1;
                let percent = (timeLeft / totalTimeForRound) * 100;
                if (bar) bar.style.width = Math.max(0, percent) + '%';

                if (timeLeft <= 0) {
                    clearInterval(roundTimer);
                    onTimeoutCallback();
                }
            }, 100);
        }

        function showFailScreen(message, retryCallbackName) {
            clearInterval(roundTimer);
            document.getElementById('game-container').innerHTML = `
                <div class="text-3xl mb-2">❌</div>
                <h3 class="text-xl font-bold text-red-400 mb-1">Провал раунда!</h3>
                <p class="text-xs text-gray-300 mb-6">${message}</p>
                <button onclick="${retryCallbackName}()" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-2xl font-bold text-white tap-highlight">Попробовать снова</button>
            `;
        }

        // --- ЭТАП 1: ТЕСТ СТРУПА ---
        let struopData = { score: 0, rounds: 0, targetCode: '', targetWord: '', mode: 'color' };
        const struopColors = [
            { name: 'КРАСНЫЙ', code: '#ef4444' },
            { name: 'СИНИЙ', code: '#3b82f6' },
            { name: 'ЗЕЛЕНЫЙ', code: '#22c55e' },
            { name: 'ЖЕЛТЫЙ', code: '#eab308' }
        ];

        function startStruopStage() {
            struopData = { score: 0, rounds: 0, targetCode: '', targetWord: '', mode: 'color' };
            nextStruopRound();
        }

        function nextStruopRound() {
            if (struopData.rounds >= 4) {
                sessionResults.struop = struopData.score;
                currentStage = 2;
                startMemoryStage();
                return;
            }

            let wordObj = struopColors[Math.floor(Math.random() * struopColors.length)];
            let colorObj = struopColors[Math.floor(Math.random() * struopColors.length)];
            struopData.targetCode = colorObj.code;
            struopData.targetWord = wordObj.name;
            struopData.mode = (currentDifficulty >= 2 && struopData.rounds % 2 !== 0) ? 'word' : 'color';
            let ruleText = struopData.mode === 'color' ? 'цвет чернил' : 'значение слова';

            document.getElementById('game-container').innerHTML = `
                <div class="text-xs text-indigo-400 font-semibold mb-1">Этап 1: Струп (Раунд ${struopData.rounds + 1}/4)</div>
                <div class="text-xs text-amber-400 font-bold mb-4">⚠️ Выбери: <span class="underline">${ruleText}</span></div>
                <div class="text-3xl font-black mb-8 tracking-wide" style="color: ${colorObj.code}">${wordObj.name}</div>
                <div class="grid grid-cols-2 gap-3 w-full">
                    <button onclick="checkStruop('КРАСНЫЙ', '#ef4444', this)" class="py-3 bg-red-600/20 border border-red-500 rounded-2xl font-bold text-red-400 tap-highlight">Красный</button>
                    <button onclick="checkStruop('СИНИЙ', '#3b82f6', this)" class="py-3 bg-blue-600/20 border border-blue-500 rounded-2xl font-bold text-blue-400 tap-highlight">Синий</button>
                    <button onclick="checkStruop('ЗЕЛЕНЫЙ', '#22c55e', this)" class="py-3 bg-emerald-600/20 border border-emerald-500 rounded-2xl font-bold text-emerald-400 tap-highlight">Зеленый</button>
                    <button onclick="checkStruop('ЖЕЛТЫЙ', '#eab308', this)" class="py-3 bg-amber-600/20 border border-amber-500 rounded-2xl font-bold text-amber-400 tap-highlight">Желтый</button>
                </div>
            `;

            startTimer(() => {
                showFailScreen("Время вышло! Тренируй скорость реакции.", "startStruopStage");
            });
        }

        function checkStruop(selectedWord, selectedHex, btn) {
            clearInterval(roundTimer);
            let isCorrect = struopData.mode === 'color' ? (selectedHex === struopData.targetCode) : (selectedWord === struopData.targetWord);

            if (isCorrect) {
                btn.className = "py-3 bg-emerald-600 border border-emerald-400 rounded-2xl font-bold text-white";
                struopData.score++;
                struopData.rounds++;
                setTimeout(nextStruopRound, 400);
            } else {
                btn.className = "py-3 bg-red-600 border border-red-400 rounded-2xl font-bold text-white";
                setTimeout(() => {
                    showFailScreen("Ошибка в тесте Струпа! Не поддавайся на когнитивные ловушки.", "startStruopStage");
                }, 400);
            }
        }

        // --- ЭТАП 2: МАТРИЦА ПАМЯТИ ---
        let memData = { pattern: [], step: 0, size: 3, count: 3, score: 0 };

        function startMemoryStage() {
            memData = { pattern: [], step: 0, size: 3, count: 3, score: 0 };
            nextMemoryRound();
        }

        function nextMemoryRound() {
            if (memData.score >= 3) {
                sessionResults.memory = memData.score * 30;
                currentStage = 3;
                startReactionStage();
                return;
            }

            memData.step = 0;
            memData.pattern = [];
            memData.size = currentDifficulty === 3 ? 4 : 3;
            memData.count = memData.size + currentDifficulty;

            let totalCells = memData.size * memData.size;
            while(memData.pattern.length < memData.count) {
                let r = Math.floor(Math.random() * totalCells);
                if(!memData.pattern.includes(r)) memData.pattern.push(r);
            }

            renderMemoryGrid(null);
            playMemSeq();
        }

        function playMemSeq() {
            let i = 0;
            let interval = setInterval(() => {
                if (i < memData.pattern.length) {
                    renderMemoryGrid(memData.pattern[i], null, null);
                    setTimeout(() => { renderMemoryGrid(null, null, null); }, 400);
                    i++;
                } else {
                    clearInterval(interval);
                    renderMemoryGrid(null, false, true); // игрок ходит
                    startTimer(() => {
                        showFailScreen("Время на запоминание и ввод вышло!", "startMemoryStage");
                    });
                }
            }, 700);
        }

        function renderMemoryGrid(activeIdx, clickIdx, isCorrectClick) {
            let gridClass = memData.size === 4 ? 'grid-cols-4' : 'grid-cols-3';
            let cellH = memData.size === 4 ? 'h-16' : 'h-20';
            
            let html = `<div class="text-xs text-indigo-400 font-semibold mb-1">Этап 2: Память (Уровень ${memData.score + 1}/3)</div>
                        <div class="text-xs text-pink-400 font-bold mb-3">Повтори последовательность</div>
                        <div class="grid ${gridClass} gap-1.5 w-full max-w-[260px] mb-2">`;
            
            let totalCells = memData.size * memData.size;
            for(let i=0; i<totalCells; i++) {
                let bg = "bg-gray-800 border-gray-700";
                if (activeIdx === i) bg = "bg-purple-500 border-purple-300 scale-95";
                if (clickIdx === i) {
                    bg = isCorrectClick ? "bg-emerald-600 border-emerald-400" : "bg-red-600 border-red-400";
                }
                html += `<div onclick="checkMemClick(${i}, this)" class="${cellH} rounded-xl border ${bg} cursor-pointer transition-all tap-highlight"></div>`;
            }
            html += `</div>`;
            document.getElementById('game-container').innerHTML = html;
        }

        function checkMemClick(idx, el) {
            let targetIdx = memData.pattern[memData.step];

            if (idx === targetIdx) {
                memData.step++;
                el.className = el.className.replace('bg-gray-800 border-gray-700', 'bg-emerald-600 border-emerald-400');
                
                if (memData.step === memData.pattern.length) {
                    clearInterval(roundTimer);
                    memData.score++;
                    setTimeout(nextMemoryRound, 800);
                }
            } else {
                clearInterval(roundTimer);
                el.className = el.className.replace('bg-gray-800 border-gray-700', 'bg-red-600 border-red-400');
                setTimeout(() => {
                    showFailScreen("Неверная плитка! Ошибка в пространственной памяти.", "startMemoryStage");
                }, 400);
            }
        }

        // --- ЭТАП 3: БЫСТРАЯ РЕАКЦИЯ ---
        let reactData = { score: 0, rounds: 0 };
        function startReactionStage() {
            reactData = { score: 0, rounds: 0 };
            nextReactRound();
        }

        function nextReactRound() {
            if (reactData.rounds >= 4) {
                sessionResults.reaction = reactData.score * 25;
                currentStage = 4;
                startMathStage();
                return;
            }

            let greenIdx = Math.floor(Math.random() * 9);
            let redIdx = -1;
            if (Math.random() > 0.3) {
                do { redIdx = Math.floor(Math.random() * 9); } while (redIdx === greenIdx);
            }

            let html = `<div class="text-xs text-indigo-400 font-semibold mb-1">Этап 3: Реакция (Раунд ${reactData.rounds + 1}/4)</div>
                        <div class="text-xs text-emerald-400 font-bold mb-3">Жми на Зеленый, избегай Красного!</div>
                        <div class="grid grid-cols-3 gap-1.5 w-full max-w-[260px] mb-2">`;

            for(let i=0; i<9; i++) {
                let bg = 'bg-gray-800 border-gray-700';
                let isTarget = false, isTrap = false;
                if (i === greenIdx) { bg = 'bg-emerald-600 border-emerald-400'; isTarget = true; }
                else if (i === redIdx) { bg = 'bg-red-600 border-red-400'; isTrap = true; }

                html += `<div onclick="checkReactClick(${isTarget}, ${isTrap}, this)" class="h-16 rounded-xl border ${bg} cursor-pointer transition-all tap-highlight"></div>`;
            }
            html += `</div>`;
            document.getElementById('game-container').innerHTML = html;

            startTimer(() => {
                showFailScreen("Медленно! Время реакции истекло.", "startReactionStage");
            });
        }

        function checkReactClick(isTarget, isTrap, el) {
            clearInterval(roundTimer);
            if (isTarget) {
                el.className = el.className.replace('bg-emerald-600', 'bg-emerald-400');
                reactData.score++;
                reactData.rounds++;
                setTimeout(nextReactRound, 400);
            } else if (isTrap) {
                el.className = el.className.replace('bg-red-600', 'bg-red-800');
                setTimeout(() => {
                    showFailScreen("Попал в ловушку! Контролируй импульсы.", "startReactionStage");
                }, 400);
            } else {
                setTimeout(() => {
                    showFailScreen("Мимо цели!", "startReactionStage");
                }, 200);
            }
        }

        // --- ЭТАП 4: МАТЕМАТИКА И ЛОГИКА ---
        let mathData = { score: 0, round: 0 };
        function startMathStage() {
            mathData = { score: 0, round: 0 };
            nextMathRound();
        }

        function nextMathRound() {
            if (mathData.round >= 3) {
                sessionResults.math = mathData.score * 30;
                finishComplexSession();
                return;
            }

            let a = Math.floor(Math.random() * 20) + 10;
            let b = Math.floor(Math.random() * 20) + 10;
            let ans = a + b;
            let opts = [ans, ans + 2, ans - 3].sort(() => Math.random() - 0.5);

            document.getElementById('game-container').innerHTML = `
                <div class="text-xs text-indigo-400 font-semibold mb-1">Этап 4: Спринт (Вопрос ${mathData.round + 1}/3)</div>
                <div class="text-3xl font-black text-white mb-6">${a} + ${b} = ?</div>
                <div class="flex flex-col gap-2.5 w-full">
                    ${opts.map(o => `<button onclick="checkMathAns(${o},${ans}, this)" class="py-3 bg-gray-800 border border-gray-700 rounded-2xl font-bold text-white tap-highlight">${o}</button>`).join('')}
                </div>
            `;

            startTimer(() => {
                showFailScreen("Время на арифметику вышло!", "startMathStage");
            });
        }

        function checkMathAns(selected, correct, btn) {
            clearInterval(roundTimer);
            if (selected === correct) {
                btn.className = "py-3 bg-emerald-600 border border-emerald-400 rounded-2xl font-bold text-white";
                mathData.score++;
                mathData.round++;
                setTimeout(nextMathRound, 400);
            } else {
                btn.className = "py-3 bg-red-600 border border-red-400 rounded-2xl font-bold text-white";
                setTimeout(() => {
                    showFailScreen("Ошибка в вычислениях!", "startMathStage");
                }, 400);
            }
        }

        // --- ФИНАЛ ---
        function finishComplexSession() {
            let totalScore = sessionResults.struop + sessionResults.memory + sessionResults.reaction + sessionResults.math;
            let totalXp = totalScore * 15 * currentDifficulty;
            
            userData.xp += totalXp;
            saveData();

            document.getElementById('game-container').innerHTML = `
                <h3 class="text-2xl font-bold text-white mb-1">🏆 Сессия Пройдена!</h3>
                <p class="text-xs text-indigo-400 font-semibold mb-4">+${totalXp} XP заработано (Уровень сложности: ${currentDifficulty})</p>
                <div class="grid grid-cols-2 gap-2 w-full mb-4 text-left text-xs">
                    <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700">Струп: ${sessionResults.struop}</div>
                    <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700">Память: ${sessionResults.memory}</div>
                    <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700">Реакция: ${sessionResults.reaction}</div>
                    <div class="bg-gray-800/60 p-2.5 rounded-xl border border-gray-700">Счет: ${sessionResults.math}</div>
                </div>
                <button onclick="document.getElementById('game-modal').classList.add('hidden')" class="w-full py-3 bg-indigo-600 rounded-2xl font-bold text-white tap-highlight">В меню</button>
            `;
        }

        loadData();
    </script>
</body>
</html>
