<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейро-Атлет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; user-select: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 shadow-2xl flex flex-col gap-4 text-center">
        <h1 class="text-2xl font-bold text-white">Нейро-Атлет</h1>
        <p class="text-xs text-indigo-400" id="status-text">Статус: Готов к работе</p>

        <div class="grid grid-cols-2 gap-3 mt-4">
            <button onclick="alert('Тест Струпа запущен!')" class="p-4 bg-indigo-600/30 border border-indigo-500 rounded-2xl font-bold text-indigo-300">Тест Струпа</button>
            <button onclick="testMemoryGame()" class="p-4 bg-purple-600/30 border border-purple-500 rounded-2xl font-bold text-purple-300">Матрица Памяти</button>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 id="modal-title" class="text-xl font-bold text-white mb-4">Игра</h2>
            <div id="modal-content" class="mb-4"></div>
            <button onclick="closeModal()" class="w-full py-3 bg-gray-800 rounded-xl font-bold text-white">Закрыть</button>
        </div>
    </div>

    <script>
        console.log("СКРИПТ ЗАГРУЖЕН УСПЕШНО");

        function testMemoryGame() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = "Матрица Памяти (Тест 3x3)";
            
            let html = '<div class="grid grid-cols-3 gap-2 mb-4">';
            for(let i = 0; i < 9; i++) {
                html += `<div onclick="this.style.background='#6366f1'" class="h-16 bg-gray-800 border border-gray-700 rounded-xl cursor-pointer"></div>`;
            }
            html += '</div><p class="text-xs text-gray-400">Нажимай на клетки!</p>';
            
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('status-text').innerText = "Статус: Игра запущена";
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('status-text').innerText = "Статус: Готов к работе";
        }
    </script>
</body>
</html>
